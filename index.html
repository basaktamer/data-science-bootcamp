<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basak Tamer | Data Science Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .project-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .project-card:hover { transform: translateY(-8px); border-color: #6366f1; }
        .img-container img { transition: transform 0.6s ease; }
        .project-card:hover .img-container img { transform: scale(1.1); }
    </style>
</head>
<body class="bg-[#f1f5f9] text-slate-800 font-sans" x-data="portfolio()">

    <header class="bg-white border-b border-slate-200 py-20 px-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
        <div class="max-w-5xl mx-auto text-center">
            <h1 class="text-5xl font-black text-slate-900 tracking-tighter uppercase mb-4">Basak Tamer</h1>
            <div class="inline-block px-4 py-1.5 bg-indigo-50 rounded-full">
                <span class="text-indigo-600 font-bold text-xs uppercase tracking-widest italic">Data Scientist & Machine Learning Engineer</span>
            </div>
        </div>
    </header>

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-lg border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-5 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex p-1.5 bg-slate-100 rounded-2xl w-full md:w-auto">
                <button @click="filter = 'all'" :class="filter === 'all' ? 'bg-white shadow-md text-indigo-600 scale-105' : 'text-slate-500'" class="flex-1 md:px-8 py-2.5 rounded-xl font-black text-[11px] uppercase transition-all">All Work</button>
                <button @click="filter = 'Specialize'" :class="filter === 'Specialize' ? 'bg-white shadow-md text-indigo-600 scale-105' : 'text-slate-500'" class="flex-1 md:px-8 py-2.5 rounded-xl font-black text-[11px] uppercase transition-all">Bootcamp</button>
                <button @click="filter = 'Kaggle'" :class="filter === 'Kaggle' ? 'bg-white shadow-md text-indigo-600 scale-105' : 'text-slate-500'" class="flex-1 md:px-8 py-2.5 rounded-xl font-black text-[11px] uppercase transition-all">Kaggle</button>
            </div>
            <div class="relative w-full md:w-96">
                <input type="text" x-model="search" placeholder="Filter by project name, model, or tool..." class="w-full bg-slate-50 border border-slate-200 pl-4 pr-10 py-3 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition-all shadow-inner">
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-16">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <template x-for="p in filteredProjects" :key="p.id">
                <div class="project-card bg-white rounded-[2rem] overflow-hidden border border-slate-100 shadow-xl shadow-slate-200/50 flex flex-col h-full">
                    
                    <div class="img-container h-52 relative overflow-hidden bg-slate-200">
                        <img :src="p.image.trim()" 
                             class="w-full h-full object-cover"
                             @error="$el.src='https://images.unsplash.com/photo-1551288049-bbda486387a3?q=80&w=1000&auto=format&fit=crop'">
                        <div class="absolute bottom-4 left-4 bg-white/95 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black text-slate-900 shadow-lg" x-text="p.id"></div>
                    </div>

                    <div class="p-8 flex flex-col flex-grow">
                        <h3 class="font-black text-slate-900 text-xl mb-6 leading-tight min-h-[3.5rem]" x-text="p.title"></h3>

                        <div class="space-y-5 flex-grow">
                            <div class="flex items-start gap-3">
                                <div class="mt-1 w-1.5 h-1.5 rounded-full bg-indigo-500 shrink-0"></div>
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter mb-1">Architecture / Model</p>
                                    <p class="text-sm font-semibold text-slate-700" x-text="p.tech"></p>
                                </div>
                            </div>
                            <div class="flex items-start gap-3">
                                <div class="mt-1 w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></div>
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter mb-1">Key Performance</p>
                                    <p class="text-sm font-black text-emerald-600" x-text="p.metric"></p>
                                </div>
                            </div>
                        </div>

                        <div class="mt-10 pt-8 border-t border-slate-100 flex gap-4">
                            <a :href="p.github" target="_blank" class="flex-1 group relative bg-slate-900 text-white text-center py-3.5 rounded-2xl text-xs font-bold uppercase overflow-hidden transition-all">
                                <span class="relative z-10">GitHub</span>
                                <div class="absolute inset-0 bg-indigo-600 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                            </a>
                            <a :href="p.huggingface" target="_blank" class="flex-1 bg-white border-2 border-indigo-600 text-indigo-600 text-center py-3.5 rounded-2xl text-xs font-bold uppercase hover:bg-indigo-600 hover:text-white transition-all">Live Demo</a>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <footer class="bg-slate-900 text-white py-20 mt-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h2 class="text-2xl font-black uppercase tracking-[0.5em] mb-4">Basak Tamer</h2>
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Driven by Data. Defined by Results.</p>
        </div>
    </footer>
