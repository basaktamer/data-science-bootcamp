    <style>

    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900" x-data="portfolio()">

    <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex bg-slate-100 p-1 rounded-xl w-full md:w-auto shadow-inner">
                <button @click="filter = 'all'" :class="filter === 'all' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'" class="flex-1 md:px-8 py-2 rounded-lg font-bold text-xs uppercase transition-all">All Projects</button>

    </div>

            <template x-for="p in filteredProjects" :key="p.id">

                    <div class="h-48 relative overflow-hidden bg-slate-200">
                        <img :src="p.image" 
                             class="w-full h-full object-cover transition-transform duration-500 hover:scale-105" 
                             @error="$el.src='https://via.placeholder.com/600x400?text=Project+Media'">
                        <div class="absolute top-4 left-4 bg-slate-900/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black text-white tracking-widest shadow-lg" x-text="p.id"></div>
                    </div>

                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="font-extrabold text-slate-800 text-lg mb-4 leading-tight h-12 line-clamp-2" x-text="p.title"></h3>

                        <div class="space-y-4 flex-grow">
                            <div class="bg-indigo-50/30 p-4 rounded-2xl border border-indigo-100/50">
                                <div class="mb-3">
                                    <span class="text-[9px] font-black text-indigo-400 uppercase block mb-1" x-text="p.type === 'Specialize' ? 'Primary Algorithm' : 'Winning Model'"></span>
                                    <span class="text-xs font-bold text-slate-700 truncate block" x-text="p.tech"></span>
                                </div>
                                <div>
                                    <span class="text-[9px] font-black text-indigo-400 uppercase block mb-1">Performance Metric</span>
                                    <span class="text-xs font-black text-indigo-700" x-text="p.metric"></span>
                                </div>
                            </div>
                        </div>

                        <div class="mt-6 pt-6 border-t border-slate-50 flex gap-3">
                            <a :href="p.github" target="_blank" class="flex-1 bg-slate-900 text-white text-center py-3 rounded-xl text-[10px] font-bold hover:bg-black uppercase tracking-wider transition-all">GitHub</a>
                            <a :href="p.huggingface" target="_blank" class="flex-1 bg-indigo-600 text-white text-center py-3 rounded-xl text-[10px] font-bold hover:bg-indigo-700 uppercase tracking-wider transition-all">Demo</a>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

        <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em]">© 2026 Basak Tamer | Professional Data Science Portfolio</p>
