<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Başak Tamer | Data Science Bootcamp Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --accent: #3b82f6;
            --bg: #fdfdfd;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; transition: all 0.2s ease-out; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-dark); margin: 0; padding: 0; }

        header { 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            color: white; 
            padding: 80px 20px; 
            text-align: center;
            border-bottom: 5px solid var(--primary);
        }
        header h1 { font-size: 3rem; margin: 0; font-weight: 800; letter-spacing: -1px; }
        header p { font-size: 1.2rem; opacity: 0.8; margin-top: 10px; }

        .controls { 
            max-width: 1200px; 
            margin: -40px auto 40px; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: var(--shadow);
            text-align: center;
        }
        .track-tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .tab-btn { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 50px; 
            background: #f1f5f9; 
            color: var(--text-light); 
            font-weight: 600; 
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        .filter-cloud { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .filter-btn { 
            font-size: 0.8rem; 
            padding: 6px 14px; 
            border-radius: 20px; 
            border: 1px solid #e2e8f0; 
            background: white; 
            cursor: pointer; 
        }
        .filter-btn.active { background: #dbeafe; border-color: var(--primary); color: var(--primary); }

        .container { max-width: 1250px; margin: 0 auto 100px; padding: 0 20px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); 
            gap: 30px; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: var(--shadow); 
            display: flex; 
            flex-direction: column;
            border: 1px solid #f1f5f9;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        
        .card-img { width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #f1f5f9; }
        
        .card-body { padding: 25px; flex-grow: 1; }
        .card-id { font-size: 0.75rem; font-weight: 800; color: var(--primary); letter-spacing: 1px; text-transform: uppercase; }
        .card-title { font-size: 1.4rem; margin: 8px 0; color: var(--text-dark); line-height: 1.2; }
        .card-cat { display: inline-block; padding: 4px 12px; background: #f8fafc; border-radius: 6px; font-size: 0.75rem; color: var(--text-light); margin-bottom: 15px; border: 1px solid #e2e8f0; }
        
        .details { font-size: 0.9rem; line-height: 1.6; color: #475569; }
        .details strong { color: var(--text-dark); font-weight: 700; }
        .details p { margin: 10px 0; border-bottom: 1px dashed #f1f5f9; padding-bottom: 5px; }

        .card-footer { padding: 20px 25px; display: flex; gap: 8px; background: #fcfcfc; }
        .btn-link { 
            flex: 1; text-align: center; text-decoration: none; font-size: 0.75rem; font-weight: 700; 
            padding: 10px 5px; border-radius: 8px; border: 1px solid #e2e8f0;
        }
        .btn-hf { background: #fffbeb; color: #92400e; }
        .btn-kg { background: #f0f9ff; color: #075985; }
        .btn-gh { background: #1e293b; color: white; border: none; }
        .btn-link:hover { filter: brightness(0.95); }
        .disabled { pointer-events: none; opacity: 0.4; filter: grayscale(1); }

        footer { text-align: center; padding: 50px; background: #f1f5f9; color: var(--text-light); font-size: 0.9rem; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>Data Science Bootcamp Portfolio</h1>
    <p>Başak Tamer • 50 Applied Machine Learning Projects</p>
</header>

<div class="controls">
    <div class="track-tabs">
        <button id="btn-specialize" class="tab-btn active" onclick="setTrack('specialize')">Specialize in Data Science (DS)</button>
        <button id="btn-pro" class="tab-btn" onclick="setTrack('pro')">Become a Pro: Kaggle Competition (C)</button>
        <button id="btn-class" class="tab-btn" onclick="setTrack('class')">Class Projects</button>
    </div>
    <div class="filter-cloud" id="filterCloud"></div>
</div>

<div class="container">
    <div class="grid" id="projectGrid"></div>
</div>

<footer>
    <p>© 2024-2026 Başak Tamer. Built with Data and Passion.</p>
</footer>

<script>
    const projects = [
        // TRACK: SPECIALIZE (DS) - (Showing first few for space, keep your original DS-01 to DS-21 here)
        { track: 'specialize', id: "DS-01", title: "Iris Flower Classification", cat: "Classification", img: "https://storage.googleapis.com/kaggle-datasets-images/19/19/default-backgrounds/dataset-cover.jpg", l1: "Random Forest (Ensemble)", l2: "100% Accuracy / 1.00 F1", l3: "Automated Taxonomic Identification", links: { hf: "https://huggingface.co/spaces/basaktamer/iris_flower_classification", kg: "https://www.kaggle.com/code/basaktamer/iris-flower-classification", gh: "https://github.com/basaktamer/DS-01-Iris-Flower-Classification/" } },
        // ... [Insert DS-02 through DS-21 here] ...

        // TRACK: BECOME A PRO (C) - (Keep your original C-01 to C-20 here)
        { track: 'pro', id: "C-01", title: "Predicting Irrigation Need", cat: "Classification", img: "https://www.kaggle.com/competitions/125220/images/header", l1: "Random Forest with Dummy Encoding", l2: "Balanced Accuracy & F1", l3: "Soil Moisture & Temp Drivers", links: { hf: "https://huggingface.co/spaces/basaktamer/Predicting_Irrigation_Need", kg: "https://www.kaggle.com/code/basaktamer/predicting-irrigation-need", gh: "https://github.com/basaktamer/C1-Predicting-Irrigation-Need" } },
        // ... [Insert C-02 through C-20 here] ...

        // NEW TRACK: CLASS PROJECTS (P)
        { 
            track: 'class', 
            id: "P-1", 
            title: "Regression Final Project", 
            cat: "Regression", 
            img: "https://storage.googleapis.com/kaggle-datasets-images/2302865/3874693/c528794abebefecb3d4221d73ba433bb/dataset-cover.jpg?t=2022-06-28-12-04-09", 
            l1: "XGBoost, CatBoost, and ANN", 
            l2: "R-squared, MAE, and RMSE", 
            l3: "Web Scraping & Anomaly Detection", 
            links: { hf: "https://huggingface.co/spaces/basaktamer/AdanaRentPrediction", kg: "N/A", gh: "https://github.com/basaktamer/P-1-Regression-Final-Project" } 
        }
        // ... [Placeholders for P-2 to P-9 as you add them] ...
    ];

    let currentTrack = 'specialize';
    let currentFilter = 'All';

    function setTrack(track) {
        currentTrack = track;
        currentFilter = 'All';
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${track}`).classList.add('active');

        renderFilters();
        renderGrid();
    }

    function setFilter(cat) {
        currentFilter = cat;
        renderGrid();
        renderFilters();
    }

    function renderFilters() {
        const cats = ['All', ...new Set(projects.filter(p => p.track === currentTrack).map(p => p.cat))];
        const cloud = document.getElementById('filterCloud');
        cloud.innerHTML = cats.map(c => `
            <button class="filter-btn ${currentFilter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>
        `).join('');
    }

    function renderGrid() {
        const filtered = projects.filter(p => 
            p.track === currentTrack && (currentFilter === 'All' || p.cat === currentFilter)
        );
        const grid = document.getElementById('projectGrid');
        
        grid.innerHTML = filtered.map(p => {
            const isKgNA = p.links.kg === "N/A";
            
            // Context-Aware Labels
            let label1, label2, label3;
            if (currentTrack === 'class') {
                label1 = 'Model Used';
                label2 = 'Evaluation Metric';
                label3 = 'Key Feature/Insight';
            } else if (currentTrack === 'pro') {
                label1 = 'Model Used';
                label2 = 'Evaluation';
                label3 = 'Key Insight';
            } else {
                label1 = 'Core Algorithm';
                label2 = 'Key Metric';
                label3 = 'Business Insight';
            }

            return `
                <div class="card">
                    <img src="${p.img}" class="card-img" onerror="this.src='https://via.placeholder.com/400x200?text=Data+Science+Project'">
                    <div class="card-body">
                        <span class="card-id">${p.id}</span>
                        <h2 class="card-title">${p.title}</h2>
                        <span class="card-cat">${p.cat}</span>
                        <div class="details">
                            <p><strong>${label1}:</strong> ${p.l1}</p>
                            <p><strong>${label2}:</strong> ${p.l2}</p>
                            <p><strong>${label3}:</strong> ${p.l3}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="${p.links.hf}" target="_blank" class="btn-link btn-hf">HF Space</a>
                        <a href="${p.links.kg}" target="_blank" class="btn-link btn-kg ${isKgNA ? 'disabled' : ''}">${isKgNA ? 'No Code' : 'Kaggle'}</a>
                        <a href="${p.links.gh}" target="_blank" class="btn-link btn-gh">GitHub</a>
                    </div>
                </div>
            `;
        }).join('');
    }

    renderFilters();
    renderGrid();
</script>
</body>
</html>
