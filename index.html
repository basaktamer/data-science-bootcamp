        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-dark); margin: 0; padding: 0; }

        /* --- Header Section --- */
        header { 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            color: white; 
            padding: 80px 20px; 
            text-align: center;
            border-bottom: 5px solid var(--primary);
        }
        header h1 { font-size: 3rem; margin: 0; font-weight: 800; letter-spacing: -1px; }
        header p { font-size: 1.2rem; opacity: 0.8; margin-top: 10px; }

        /* --- Controls & Tabs --- */
        .controls { 
            max-width: 1200px; 
            margin: -40px auto 40px; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: var(--shadow);
            text-align: center;
        }
        .track-tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .tab-btn { 
            padding: 12px 25px; 
            border: none; 
            border-radius: 50px; 
            background: #f1f5f9; 
            color: var(--text-light); 
            font-weight: 600; 
            cursor: pointer;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        .filter-cloud { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .filter-btn { 
            font-size: 0.8rem; 
            padding: 6px 14px; 
            border-radius: 20px; 
            border: 1px solid #e2e8f0; 
            background: white; 
            cursor: pointer; 
        }
        .filter-btn.active { background: #dbeafe; border-color: var(--primary); color: var(--primary); }

        /* --- Grid Layout --- */
        .container { max-width: 1250px; margin: 0 auto 100px; padding: 0 20px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); 
            gap: 30px; 
        }

        /* --- Project Card Styling --- */
        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: var(--shadow); 
            display: flex; 
            flex-direction: column;
            border: 1px solid #f1f5f9;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        
        .card-img { width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #f1f5f9; }
        
        .card-body { padding: 25px; flex-grow: 1; }
        .card-id { font-size: 0.75rem; font-weight: 800; color: var(--primary); letter-spacing: 1px; text-transform: uppercase; }
        .card-title { font-size: 1.4rem; margin: 8px 0; color: var(--text-dark); line-height: 1.2; }
        .card-cat { display: inline-block; padding: 4px 12px; background: #f8fafc; border-radius: 6px; font-size: 0.75rem; color: var(--text-light); margin-bottom: 15px; border: 1px solid #e2e8f0; }
        
        .details { font-size: 0.9rem; line-height: 1.6; color: #475569; }
        .details strong { color: var(--text-dark); }
        .details p { margin: 10px 0; border-bottom: 1px dashed #f1f5f9; padding-bottom: 5px; }

        .card-footer { padding: 20px 25px; display: flex; gap: 8px; background: #fcfcfc; }
        .btn-link { 
            flex: 1; text-align: center; text-decoration: none; font-size: 0.75rem; font-weight: 700; 
            padding: 10px 5px; border-radius: 8px; border: 1px solid #e2e8f0;
        }
        .btn-hf { background: #fffbeb; color: #92400e; }
        .btn-kg { background: #f0f9ff; color: #075985; }
        .btn-gh { background: #1e293b; color: white; border: none; }
        .btn-link:hover { filter: brightness(0.95); }
        .disabled { pointer-events: none; opacity: 0.4; filter: grayscale(1); }

        footer { text-align: center; padding: 50px; background: #f1f5f9; color: var(--text-light); font-size: 0.9rem; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            header h1 { font-size: 2rem; }
        }

    let currentTrack = 'specialize';
    let currentFilter = 'All';

    function setTrack(track) {
        currentTrack = track;
        currentFilter = 'All';
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('onclick').includes(track));
        });
        renderFilters();
        renderGrid();
    }

    function setFilter(cat) {
        currentFilter = cat;
        renderGrid();
        renderFilters();
    }

    function renderFilters() {
        const cats = ['All', ...new Set(projects.filter(p => p.track === currentTrack).map(p => p.cat))];
        const cloud = document.getElementById('filterCloud');
        cloud.innerHTML = cats.map(c => `
            <button class="filter-btn ${currentFilter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>
        `).join('');
    }

    function renderGrid() {
        const filtered = projects.filter(p => 
            p.track === currentTrack && (currentFilter === 'All' || p.cat === currentFilter)
        );
        const grid = document.getElementById('projectGrid');
        
        grid.innerHTML = filtered.map(p => {
            const isKgNA = p.links.kg === "N/A" || !p.links.kg;
            const isHfNA = p.links.hf === "N/A" || !p.links.hf;
            
            return `
                <div class="card">
                    <img src="${p.img}" class="card-img" onerror="this.src='https://via.placeholder.com/400x200?text=Data+Science+Project'">
                    <div class="card-body">
                        <span class="card-id">${p.id}</span>
                        <h2 class="card-title">${p.title}</h2>
                        <span class="card-cat">${p.cat}</span>
                        <div class="details">
                            <p><strong>Method/Model:</strong> ${p.l1}</p>
                            <p><strong>Metrics:</strong> ${p.l2}</p>
                            <p><strong>Key Insight:</strong> ${p.l3}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="${p.links.hf}" target="_blank" class="btn-link btn-hf ${isHfNA ? 'disabled' : ''}">${isHfNA ? 'No App' : 'HF Space'}</a>
                        <a href="${p.links.kg}" target="_blank" class="btn-link btn-kg ${isKgNA ? 'disabled' : ''}">${isKgNA ? 'No Code' : 'Kaggle'}</a>
                        <a href="${p.links.gh}" target="_blank" class="btn-link btn-gh">GitHub</a>
                    </div>
                </div>
            `;
        }).join('');
    }

    renderFilters();
    renderGrid();
