<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basak Tamer | Data Science Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .project-card { transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .project-card:hover { transform: translateY(-5px); border-color: #6366f1; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50" x-data="portfolio()">

        <p class="text-indigo-400 font-medium">Data Science & Machine Learning Portfolio (41 Projects)</p>
    </header>

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex bg-slate-100 p-1 rounded-xl">
                <button @click="filter = 'All'" :class="filter === 'All' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'" class="px-6 py-2 rounded-lg font-bold text-xs uppercase transition-all">All</button>

        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="p in filteredProjects" :key="p.id">
                <div class="project-card bg-white rounded-2xl overflow-hidden flex flex-col h-full shadow-sm">
                    <div class="h-44 relative bg-slate-200">
                        <img :src="p.image" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x200?text=Project'">
                        <div class="absolute top-2 left-2 bg-black/70 text-white text-[10px] px-2 py-1 rounded font-bold" x-text="p.id"></div>
                    </div>

                    <div class="p-5 flex-grow">
                        <h3 class="font-bold text-md mb-3 text-slate-800 leading-tight border-b pb-2 h-12 flex items-center" x-text="p.title"></h3>
                        
                        <template x-if="p.type === 'Specialize'">
                            <div class="space-y-4">
                                <div>
                                    <span class="text-[9px] font-black text-indigo-500 uppercase block mb-1">Business Insight</span>
                                    <p class="text-xs text-slate-600 italic leading-tight" x-text="p.business_insight"></p>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-2">
                                    <div>
                                        <span class="text-[8px] font-bold text-slate-400 uppercase block">Core Algorithm</span>
                                        <span class="text-[10px] font-bold text-slate-700" x-text="p.core_algorithm"></span>
                                    </div>
                                    <div>
                                        <span class="text-[8px] font-bold text-slate-400 uppercase block">Key Metric</span>
                                        <span class="text-[10px] font-bold text-indigo-700" x-text="p.key_metric"></span>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template x-if="p.type === 'Kaggle'">
                            <div class="space-y-4">
                                <div>
                                    <span class="text-[9px] font-black text-purple-500 uppercase block mb-1">Key Feature/Insight</span>
                                    <p class="text-xs text-slate-600 italic leading-tight" x-text="p.key_feature_insight"></p>
                                </div>
                                <div class="bg-purple-50 p-3 rounded-xl border border-purple-100 space-y-2">
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <span class="text-[8px] font-bold text-purple-400 uppercase block">Problem</span>
                                            <span class="text-[10px] font-bold text-slate-700" x-text="p.problem_type"></span>
                                        </div>
                                        <div>
                                            <span class="text-[8px] font-bold text-purple-400 uppercase block">Metric</span>
                                            <span class="text-[10px] font-bold text-slate-700" x-text="p.evaluation_metric"></span>
                                        </div>
                                    </div>
                                    <div class="pt-2 border-t border-purple-100">
                                        <span class="text-[8px] font-bold text-purple-400 uppercase block">Model Used</span>
                                        <span class="text-[10px] font-bold text-purple-800" x-text="p.model_used"></span>
                                    </div>
                                </div>
                            </div>
                        </template>

                    </div>
                </div>
            </template>
        </div>
    </main>
